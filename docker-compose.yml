version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: tech-flow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tech_flow
    ports:
      - "5433:5432"
    volumes:
      - tech-flow-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tech-flow-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tech_flow?schema=public"
      JWT_SECRET: "replace_this_with_a_long_random_secret_key"
      JWT_EXPIRES_IN: "7d"
      PORT: 5000
      CLIENT_URL: "http://localhost:3000"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: tech-flow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    ports:
      - "3000:3000"

volumes:
  tech-flow-db-data: